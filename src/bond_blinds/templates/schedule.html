<div class="date">$date</div>
<div class="schedule">
  <div class="event open">
    <div class="event-label">Open</div>
    <div class="event-time">$open_time</div>
    <div class="solar"><svg viewBox="0 0 24 24" fill="none" stroke="#f0c040" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg>$sunrise</div>
  </div>
  <div class="event close">
    <div class="event-label">Close</div>
    <div class="event-time">$close_time</div>
    <div class="solar"><svg viewBox="0 0 24 24" fill="none" stroke="#6088d0" stroke-width="2.5" stroke-linecap="round"><path d="M12 10a4 4 0 0 1 4 4"/><path d="M12 10a4 4 0 0 0-4 4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="2" y1="14" x2="5" y2="14"/><line x1="19" y1="14" x2="22" y2="14"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/><line x1="2" y1="18" x2="22" y2="18"/></svg>$sunset</div>
  </div>
</div>
<div class="controls">
  <form method="post" action="/action/Open">
    <button type="submit" class="btn btn-open">Open Blinds</button>
  </form>
  <form method="post" action="/action/Close">
    <button type="submit" class="btn btn-close">Close Blinds</button>
  </form>
</div>
