[project]
name = "bond-blinds"
version = "0.1.0"
description = "Daemon to schedule RF blind commands via Bond Bridge with retry support"
requires-python = ">=3.13"
dependencies = [
    "astral>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "zeroconf>=0.131",
]

[project.scripts]
bond-blinds = "bond_blinds.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bond_blinds"]
